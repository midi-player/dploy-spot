    <style>
      html,body{margin:0;background:#e05858}
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#e05858;transition:opacity .5s ease,visibility .5s}
      #boot.hide{opacity:0;visibility:hidden}
      .boot-logo{width:min(260px,60vw);display:grid;justify-items:center;gap:22px}
      .boot-logo svg{width:100%;animation:bootPulse 1.1s ease-in-out infinite}
      .boot-logo i{display:block;width:70%;height:3px;border-radius:3px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
      .boot-logo i:after{content:"";position:absolute;inset:0;width:40%;background:#fff;border-radius:3px;animation:bootBar 1.1s ease-in-out infinite}
      @keyframes bootPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.8}}
      @keyframes bootBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    </style>

    <script type="module" src="/src/main.tsx"></script>
